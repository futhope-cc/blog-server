server:
  # 端口
  port: 8081
  servlet:
    context-path: /api

spring:
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8
    username: root
    password: 123456


  # redis配置 (SpringBoot3+ 使用 spring.data.redis)
  data:
    redis:
      # Redis数据库索引（默认为0）
      database: 1
      # Redis服务器地址
      host: 127.0.0.1
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码（默认为空）
      password: 123456
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0

  # 建表脚本位于 resources/sql/init.sql，由开发者手动执行，应用启动时不再自动运行

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 关闭 cookie 读取，前后端分离架构下 token 统一通过 header 传递
  is-read-cookie: false

mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: true
  mapper-locations: classpath:/mapper/**.xml
  type-aliases-package: com.cc.blogserver.domain
  # 逻辑删除不走 MyBatis-Plus @TableLogic，由代码手动维护 is_delete 字段(删除=更新为1，查询=带 is_delete=0)

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
